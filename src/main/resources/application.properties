spring.datasource.url=jdbc:mariadb://localhost:3306/build_bruh
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=build_bruh
spring.datasource.password=build_bruh
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=8080
# OpenAPI docs (Swagger UI at /swagger-ui/index.html). Static copies are written to target/openapi by the build.
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
