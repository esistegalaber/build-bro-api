spring.datasource.url=jdbc:mariadb://localhost:3306/build_bruh
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=build_bruh
spring.datasource.password=build_bruh
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=8080
# Datetime columns hold UTC (#15). Hibernate already binds Instants as UTC; this also covers any other date type
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Health checks (#24): /actuator/health/liveness and /actuator/health/readiness, also outside Kubernetes.
# Readiness includes the database, liveness doesn't: a database outage must not make orchestrators restart the API
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Wait at most 5 s for a pooled connection (Hikari's default is 30 s), so that readiness and API requests fail
# after 5 s, not 30 s, while the database is unreachable (#24)
spring.datasource.hikari.connection-timeout=5000
