# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Maven and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Build 'n Sonar

on:
  push:
    branches: [ "main" ]
    # A GitHub release vX.Y.Z (on a main commit) publishes the image X.Y.Z, X.Y and latest (#28)
    tags: [ "v*" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

# One run per ref at a time. On main, runs queue, so the main image always ends on the newest commit (a
# pending run is replaced by a newer one, so a commit in between may get no image). On PRs, a new push
# cancels the running one: its image would be replaced anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Tests start their own MariaDB via Testcontainers (Docker is preinstalled on ubuntu-latest)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Without Sonar: Dependabot runs get no Actions secrets (SONAR_TOKEN would be empty), and release tags
      # would show up in Sonar as a branch each
      - name: Build (Dependabot and release tags, without Sonar)
        if: github.actor == 'dependabot[bot]' || startsWith(github.ref, 'refs/tags/v')
        run: ./mvnw -B verify
      - name: Build and SonarLyze
        if: github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      # Node is preinstalled on ubuntu-latest; the script pins the Redocly CLI version
      - name: Render API docs with Redocly
        run: ./redoc-docs.sh
      - name: Upload static API docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: target/openapi/

  # Builds, scans and smoke-tests the Docker image (#23), then publishes exactly that image to GHCR (#28).
  # Runs after build, so nothing is built or published when the tests fail; the push is the last step, so
  # only an image that passed Trivy and the smoke test is published.
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Dependabot and fork PRs get a read-only token: their image is built and checked, but not published
      CAN_PUBLISH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    services:
      mariadb:
        image: mariadb:10.10
        env:
          MARIADB_DATABASE: build_bruh
          MARIADB_USER: build_bruh
          MARIADB_PASSWORD: build_bruh
          MARIADB_ROOT_PASSWORD: build_bruh
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tags: pr-<N> on PRs; main and sha-<7> on main; X.Y.Z, X.Y and latest (flavor latest=auto: release
      # tags that aren't pre-releases) on vX.Y.Z tags. Plus the OCI labels version, revision and created.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # metadata-action takes the description from the GitHub repo's (empty), which would overwrite the
          # Dockerfile's label; keep this text in step with it
          labels: |
            org.opencontainers.image.description=Build Bruh REST API: builds, build sets, servers and deployments
      # amd64 only; the Dockerfile is architecture-neutral, so it also builds natively on arm64
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: build-bro-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          # The jar's version: the release's X.Y.Z on vX.Y.Z tags, otherwise the pom's 1.0-SNAPSHOT
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || '' }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: build-bro-api:ci
          # The action's default Trivy (v0.70.0) failed to install; Dependabot doesn't update this, so bump it by hand
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Check that the image doesn't run as root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' build-bro-api:ci)
          echo "Image user: '$user'"
          case "$user" in ""|0|0:*|root|root:*) echo "::error::The image runs as root"; exit 1;; esac
      # Read-only root filesystem, like production should run it. Readiness answers 200 once Flyway has migrated,
      # the API is up and it reaches the database (#24)
      - name: Smoke test against MariaDB
        run: |
          docker run -d --name api --read-only --tmpfs /tmp --network host \
            -e SPRING_DATASOURCE_URL=jdbc:mariadb://127.0.0.1:3306/build_bruh \
            -e SPRING_DATASOURCE_USERNAME=build_bruh \
            -e SPRING_DATASOURCE_PASSWORD=build_bruh \
            build-bro-api:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness; then echo; echo "Ready"; exit 0; fi
            sleep 2
          done
          echo "::error::The API was not ready within 120 s"
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs api || true
      # Publishes the image that was just tested (retagged, not rebuilt)
      - name: Log in to GHCR
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        if: env.CAN_PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag build-bro-api:ci "$tag"
            docker push "$tag"
          done
          {
            echo "### Published"
            for tag in $TAGS; do echo "- \`$tag\`"; done
            echo
            echo "Digest: \`$(docker inspect --format '{{index .RepoDigests 0}}' build-bro-api:ci)\`"
          } >> "$GITHUB_STEP_SUMMARY"
