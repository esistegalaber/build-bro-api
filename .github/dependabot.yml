# Keeps dependencies up to date with pull requests.
version: 2
updates:
  # The SHA-pinned actions in .github/workflows: Dependabot opens a PR with the new commit SHA
  # (and updates the version comment) when an action releases a new version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Maven dependencies and plugins in pom.xml (versions set directly or via <properties>).
  # Monthly, with minor and patch updates grouped into one PR; major updates come one PR each.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  # The base images in the Dockerfile, pinned by digest: Dependabot updates the tag and the digest.
  # The docker job in build.yml builds, scans and smoke-tests every such PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
